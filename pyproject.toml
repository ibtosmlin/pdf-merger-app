[project]
name = "pdf_merger_app"
version = "0.1.0"
description = "Streamlit app to merge Word, Excel, PowerPoint, and PDF into a single PDF"
authors = [
    { name = "osamu.ibata" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "PyMuPDF>=1.23.0",
    "pywin32>=311",
    "streamlit>=1.30.0",
    "streamlit-sortables>=0.3.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
